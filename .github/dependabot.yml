version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
    # release.yml is generated by cargo-dist; its action pins live in
    # [workspace.metadata.dist.github-action-commits] in Cargo.toml.
    exclude-paths:
      - ".github/workflows/release.yml"
