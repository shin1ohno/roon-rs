rules:
  # release.yml is generated by cargo-dist (`dist generate`); `dist plan`
  # fails on any hand edit, so what dist hard-codes is accepted here:
  # - excessive-permissions: workflow-level `contents: write`, which the
  #   host job needs to create the GitHub Release.
  # - template-injection: `${{ matrix.* }}` / `${{ needs.plan.outputs.* }}`
  #   in run:, all values computed by `dist plan` from Cargo.toml and the
  #   pushed tag name, not from PR titles, bodies or branch names.
  # - unpinned-images: `container:` comes from the dist matrix; no target in
  #   [workspace.metadata.dist] sets a container, so it is always null.
  excessive-permissions:
    ignore:
      - release.yml
  template-injection:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml

  # Trusted publishing migration is a separate plan; until then the publish
  # step authenticates with CARGO_REGISTRY_TOKEN passed through env.
  use-trusted-publishing:
    ignore:
      - publish-crates.yml
