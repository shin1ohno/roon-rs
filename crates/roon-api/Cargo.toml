[package]
name = "roon-api"
version = "0.5.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Rust SDK for Roon audio system (discovery, transport, browse)"
repository = "https://github.com/shin1ohno/roon-rs"
homepage = "https://github.com/shin1ohno/roon-rs"
readme = "../../README.md"
keywords = ["roon", "audio", "music", "sdk", "transport"]
categories = ["multimedia::audio", "api-bindings"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
roon-moo = { path = "../roon-moo", version = "0.5.2" }
roon-sood = { path = "../roon-sood", version = "0.5.2" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
anyhow = "1"
dirs-next = "2"
futures-util = "0.3"
roon-moo = { path = "../roon-moo", version = "0.5.2" }
tokio-tungstenite = "0.26"
tracing-subscriber = { workspace = true }
