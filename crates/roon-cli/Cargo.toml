[package]
name = "roon-cli"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "CLI tool for controlling Roon audio system"
repository = "https://github.com/shin1ohno/roon-rs"
homepage = "https://github.com/shin1ohno/roon-rs"
readme = "../../README.md"
keywords = ["roon", "audio", "music", "cli", "player"]
categories = ["multimedia::audio", "command-line-utilities"]

[[bin]]
name = "roon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs-next = "2"
roon-api = { path = "../roon-api", version = "0.2.0" }
roon-sood = { path = "../roon-sood", version = "0.2.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = "0.8"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
