[package]
name = "roon-hub"
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "MQTT bridge for Roon audio system with per-device zone routing"
repository = "https://github.com/shin1ohno/roon-rs"
homepage = "https://github.com/shin1ohno/roon-rs"
readme = "../../README.md"
keywords = ["roon", "audio", "mqtt", "bridge", "home-automation"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
anyhow = "1"
roon-api = { path = "../roon-api", version = "0.5.0" }
rumqttc = "0.24"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = "0.8"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
