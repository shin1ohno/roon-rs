[package]
name = "roon-mcp"
version = "0.5.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "MCP server exposing Roon audio system as AI assistant tools"
repository = "https://github.com/shin1ohno/roon-rs"
homepage = "https://github.com/shin1ohno/roon-rs"
readme = "../../README.md"
keywords = ["roon", "audio", "mcp", "ai", "assistant"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
anyhow = "1"
bytes = { workspace = true }
dirs-next = "2"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmcp = { git = "https://github.com/shin1ohno/rust-sdk.git", branch = "feat/sse-server-transport", features = ["server", "transport-io", "transport-streamable-http-server", "transport-sse-server"] }
roon-api = { path = "../roon-api", version = "0.5.3" }
schemars = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-service = "0.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# OpenTelemetry — OTLP gRPC export to the standalone apm-server LXC.
# Same shape as the weave-server companion (weave PR #70). Gated by
# OTEL_EXPORTER_OTLP_ENDPOINT at runtime so unit tests / stdio-mode
# invocations without APM keep working.
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "tls", "tls-roots"] }
tracing-opentelemetry = "0.28"
tonic = { version = "0.12", default-features = false, features = ["transport", "tls", "tls-roots"] }

[dev-dependencies]
wiremock = "0.6"
