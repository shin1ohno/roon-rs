[package]
name = "roon-mcp"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "MCP server exposing Roon audio system as AI assistant tools"
repository = "https://github.com/shin1ohno/roon-rs"
homepage = "https://github.com/shin1ohno/roon-rs"
readme = "../../README.md"
keywords = ["roon", "audio", "mcp", "ai", "assistant"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
anyhow = "1"
dirs-next = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
rmcp = { version = "1.4", features = ["server", "transport-io", "transport-streamable-http-server"] }
roon-api = { path = "../roon-api", version = "0.4.0" }
schemars = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-service = "0.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
