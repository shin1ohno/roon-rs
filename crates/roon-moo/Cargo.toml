[package]
name = "roon-moo"
version = "0.5.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "MOO WebSocket RPC protocol for Roon audio system"
repository = "https://github.com/shin1ohno/roon-rs"
homepage = "https://github.com/shin1ohno/roon-rs"
readme = "../../README.md"
keywords = ["roon", "audio", "music", "websocket", "rpc"]
categories = ["multimedia::audio", "network-programming"]

[dependencies]
bytes = { workspace = true }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = "0.26"
tracing = { workspace = true }

[dev-dependencies]
proptest = "1"
