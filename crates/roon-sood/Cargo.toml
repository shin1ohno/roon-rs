[package]
name = "roon-sood"
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "SOOD UDP discovery protocol for Roon audio system"
repository = "https://github.com/shin1ohno/roon-rs"
homepage = "https://github.com/shin1ohno/roon-rs"
readme = "../../README.md"
keywords = ["roon", "audio", "music", "discovery", "sood"]
categories = ["multimedia::audio", "network-programming"]

[dependencies]
bytes = { workspace = true }
socket2 = "0.5"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
proptest = "1"
